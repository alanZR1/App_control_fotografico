

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:17
    container_name: database_photographic_control
    restart: unless-stopped
    command: ["postgres", "-c", "ssl=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kira123
      POSTGRES_DB: control_fotografico
    ports:
      - "5432:5432"
    volumes:
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control_fotografico"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - photographic_control_network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: photographic_control_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - photographic_control_network
    # Required for host.docker.internal to work on Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ===========================================
# Networks
# ===========================================
networks:
  photographic_control_network:
    driver: bridge
    name: photographic_control_network

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
    name: photographic_postgres_data
